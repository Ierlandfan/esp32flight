    version: ">=5.1.0"

  lvgl/lvgl:
    version: ">8.3.9,<9"
    public: true

  esp_lcd_touch_gt911: "^1"

  espressif/mdns: "^1"

  espressif/esp_websocket_client: "^1"

  # M5Stack Tab5 (ESP32-P4): MIPI-DSI panel + Wi-Fi over the ESP32-C6 co-processor
  espressif/esp_lcd_ili9881c:
    version: "^1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lcd_touch_st7123:
    version: "^1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "<2.12"
    rules:
      - if: "target == esp32p4"
